# Заливка сайта на российский хостинг по SSH (rsync).
# Секреты (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST      адрес сервера из панели хостинга
#   DEPLOY_USER      логин SSH
#   DEPLOY_PASSWORD  пароль SSH
#   DEPLOY_PATH      папка сайта на сервере, например /home/u123/stylearchive.art/public_html/
#   DEPLOY_PORT      (необязательно) порт SSH, по умолчанию 22
# Переменная (вкладка Variables):
#   MAINTENANCE_MODE = 1  -> index.html на сервере НЕ перезаписывается (там висит заглушка).
#                            Чтобы открыть сайт: удалить переменную и запустить workflow.
name: Deploy to hosting

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync

      - name: Upload
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_: ${{ secrets.DEPLOY_USER }}
          PASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEST: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          MAINT: ${{ vars.MAINTENANCE_MODE }}
        run: |
          set -uo pipefail
          export SSHPASS="$PASS"
          SSH="sshpass -e ssh -p ${PORT:-22} -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=6"
          EXCLUDES=(--exclude=.git --exclude=.github --exclude=tests --exclude=tools
                    --exclude=docs --exclude=README.md --exclude=.gitignore)

          # rsync с повторами: при обрыве соединения продолжает с места остановки
          sync() {  # sync <rsync-флаги> <откуда> <куда>
            local n=0
            until rsync "$@"; do
              n=$((n+1))
              [ "$n" -ge 6 ] && { echo "::error::rsync не удался после $n попыток"; return 1; }
              echo "::warning::обрыв, повтор $n через 20 с"; sleep 20
            done
          }

          # 1) картинки по папкам. Сначала AM (thumb, web): сайт оживает раньше.
          #    WebP уже сжат, поэтому без -z; --size-only: mtime после checkout всегда новый
          for d in thumb web opus sky; do
            echo "=== media/$d ==="
            sync -rl --size-only --partial --timeout=180 --info=stats1 -e "$SSH" \
              "media/$d/" "$USER_@$HOST:${DEST%/}/media/$d/" || exit 1
          done

          # 2) остальное (html, js, css, data): по контрольной сумме, чтобы не пропустить правку того же размера
          echo "=== остальные файлы ==="
          EXTRA=()
          if [ "${MAINT:-}" = "1" ]; then
            EXTRA=(--exclude=/index.html)
            echo "::notice::MAINTENANCE_MODE=1: index.html не трогаем, на сайте остаётся заглушка"
          fi
          sync -rlzc --timeout=180 --info=stats1 -e "$SSH" "${EXCLUDES[@]}" "${EXTRA[@]}" --exclude=media/ \
            ./ "$USER_@$HOST:${DEST%/}/" || exit 1
