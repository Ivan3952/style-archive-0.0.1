# Проверки для pull request и main: сборка, данные по схемам, смоук-тест.
# Выкладка на хостинг делается отдельным workflow (deploy-hosting.yml).
name: Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Format check
        run: npm run format:check

      - name: Data audit
        run: python3 tools/audit_data.py

      - name: Importer test
        run: python3 tests/test_import.py

      - name: Mixes importer test
        run: python3 tests/test_mixes.py

      - name: Embeddings tools test
        run: python3 tests/test_embed.py

      - name: Prompt parser test
        run: node tests/prompt_parse.test.mjs

      - name: Characters importer test
        run: python3 tests/test_characters.py

      - name: Smoke test
        run: python3 tests/smoke.py
